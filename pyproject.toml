[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zaikishang-multihopgap"
version = "0.1.0"
description = "把多跳问题拆成跳链，标出链条中没有任何文档支撑的那一跳"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zaikishang" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://zaikishang.github.io"
Repository = "https://github.com/zaikishang/multihopgap"
Issues = "https://github.com/zaikishang/multihopgap/issues"

[project.scripts]
multihopgap = "multihopgap:main"

[tool.setuptools]
py-modules = ["multihopgap"]
